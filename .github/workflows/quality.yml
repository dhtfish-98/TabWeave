name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: node --test — node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependency install: the tests use the built-in node:test runner, and the
      # dispatch tests preload a Playwright stub before starting the real server.
      # Installing playwright would pull browser binaries this suite never touches.
      - name: Test
        run: npm test
